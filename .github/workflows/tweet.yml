name: THE ALGORITHM feeds

on:
  schedule:
    # text tweet + trend export, every 2 hours -> ~360/month, under the free-tier 500/month cap
    - cron: "17 */2 * * *"
    # image drop, every 3 hours -> stops firing on its own once images/ runs dry
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      text:
        description: "post this exact text (leave blank to auto-generate)"
        type: string
        required: false
      image:
        description: "post an image instead of a text tweet"
        type: boolean
        default: false
      whoami:
        description: "just check which account the keys belong to -- posts nothing"
        type: boolean
        default: false

permissions:
  contents: write   # lets the job commit state.json + trends.json + tweets.json

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install tweepy

      - name: check which account the keys belong to
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.whoami == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py --whoami

      - name: post the exact text you typed
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.whoami != 'true' && github.event.inputs.text != '' && github.event.inputs.image != 'true'
        env:
          # passed as an env var, never interpolated into the shell line --
          # quotes/backticks/$ in your tweet would otherwise run as commands
          TWEET_TEXT: ${{ github.event.inputs.text }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py --text "$TWEET_TEXT"

      - name: generate and post a text tweet
        if: github.event.schedule == '17 */2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.whoami != 'true' && github.event.inputs.image != 'true' && github.event.inputs.text == '')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python bot.py

      - name: post an image
        if: github.event.schedule == '47 */3 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.whoami != 'true' && github.event.inputs.image == 'true')
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py --post-image

      - name: export live trends for the website
        if: github.event.schedule == '17 */2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.whoami != 'true' && github.event.inputs.image != 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python bot.py --emit-json trends.json

      - name: persist memory + trends
        run: |
          git config user.name "the-algorithm"
          git config user.email "actions@users.noreply.github.com"
          git add state.json trends.json tweets.json images/ || true
          git diff --cached --quiet || git commit -m "the organism remembers"
          git push || true
